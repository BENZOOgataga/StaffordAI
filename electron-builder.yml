# Packaging config. Unsigned, unpacked-dir builds only.
#
# The whole reason this exists is the asarUnpack line. A .node binary cannot be
# loaded from inside an asar archive, so better-sqlite3 is unpacked beside the app.
# It is the storage dependency, Node-API with a flat-file prebuild per arch, so it
# ships prebuilt under npmRebuild off with no compiler; the only invariant for it
# is that its binary is unpacked rather than sealed into the asar.

appId: net.benzoogataga.stafford
productName: Stafford

# Do not rebuild native modules from source. better-sqlite3 is Node-API and ships a
# prebuilt binary for every target arch, so the prebuilt one is what ships. With this
# on, electron-builder ran @electron/rebuild which invoked node-gyp, and on Windows
# that needs Visual Studio and failed with "Could not find any Visual Studio
# installation". The invariant holds through the prebuilt file rather than a rebuilt one.
npmRebuild: false

directories:
  output: dist
  buildResources: build

# electron-vite builds into out/. Package that, plus the manifest.
files:
  - out/**/*
  - package.json

# The invariant. better-sqlite3 carries a .node binary that cannot live inside the asar.
asarUnpack:
  - node_modules/better-sqlite3/**

mac:
  # Both darwin arches, because a macOS user may be on either. Each CI leg builds one
  # arch natively, on an arm64 and an x64 runner, filtered with --arm64 / --x64.
  target:
    - target: dir
      arch:
        - arm64
        - x64
  # Unsigned: there is no Apple Developer account yet. identity null tells
  # electron-builder not to attempt signing rather than fail looking for a
  # certificate. Signing gates the updater, not this task.
  identity: null

win:
  # Windows is the reference platform, so a packaged Windows build is worth
  # proving. The darwin spawn-helper invariant does not apply here; the packaged
  # bundle check reports that explicitly and asserts the Windows equivalent,
  # that node-pty's native .node modules are unpacked from the asar. x64 only:
  # node-pty ships a win32-arm64 prebuild too, but the daily machine and the CI
  # runner are x64, so arm64 is not built until there is a reason.
  #
  # Deliberately unsigned, deterministically. There is no signtoolOptions and no
  # cert, so nothing requests signing, but a CSC_LINK or WIN_CSC_LINK env var on a
  # build machine would otherwise make electron-builder sign with whatever cert it
  # points at. The no-op sign hook runs in signtool's place and applies nothing, so
  # a public artifact can never pick up a local or work cert and carry an employer
  # identity into the binary, whatever is in the machine's store or environment.
  # v0.1.x ships unsigned; the packaged-bundle check asserts Stafford.exe carries no
  # Authenticode signature. In electron-builder 26 the custom sign hook lives under
  # signtoolOptions, and it replaces the signtool call, so even a CSC-provided cert is
  # never applied.
  signtoolOptions:
    sign: scripts/no-sign.cjs
  # v0.1.0 ships Windows-only, so this leg produces a real distributable, not just
  # the dir build that proved compilation. zip builds win-unpacked first, which the
  # packaged-bundle check still reads, then zips it into the downloadable artifact.
  # No installer: an unsigned NSIS installer trips SmartScreen harder than a zip the
  # user unpacks and runs, and the README documents the unpack-and-run path.
  artifactName: ${productName}-${version}-win-${arch}.zip
  target:
    - target: zip
      arch:
        - x64
