name: pty probe

# Diagnostic, not part of CI. Answers whether a hosted runner can open a
# pseudo-terminal at all, before anyone tries to fix the pty suite failing on
# both platforms. Delete this workflow once the answer is recorded in
# docs/stack-migration-verification.md.
# Answered 2026-08-07 and recorded in docs/stack-migration-verification.md, so
# it no longer runs on every push. Kept on manual dispatch because the Windows
# half of the answer is a bug that is not fixed yet, and this is how the fix
# gets confirmed on a runner rather than only locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: pty probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # This one opens ptys on purpose, so it is the likeliest to hang.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Never fails the job. The log is the result: a runner that cannot open a
      # pty should still produce a readable answer rather than a red job with a
      # truncated child, which is the situation this exists to explain.
      - name: can a pty open here
        run: node .github/probes/pty-probe.cjs
