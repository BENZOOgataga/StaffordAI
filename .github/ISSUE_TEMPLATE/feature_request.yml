name: Feature request
description: Suggest something Stafford should do.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: What are you trying to do that Stafford makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like instead?
      description: Describe the change. If it fits the people-centric model (a colleague should be able to
        do X), say it that way.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Stafford is primarily a personal project with a direction I hold closely, so a request may not be
        taken up even when it is reasonable. Filing it is still useful.
