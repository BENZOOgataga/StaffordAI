<!doctype html>
<meta charset="utf-8" />
<title>Stafford</title>
<!--
  The roster. A calm, mostly-quiet room of colleagues, with one warm signal when
  one of them needs you. Dark by default, because this sits ambient in a tray. The
  one place boldness is spent is the waiting card: a warm amber edge and a soft
  lift among cool, recessed idle and working cards.

  No fixed widths sized to English. State and task lines vary by language, so
  cards flex and text wraps. Reduced motion and reduced transparency are honoured.
  The platform system font, because no external face can load under the CSP and
  the personality lives in the treatment and the amber signature, not a novelty
  face.
-->
<style>
  :root {
    --bg: #14181F;
    --surface: #1E242E;
    --surface-hover: #232B38;
    --text: #E7EAF0;
    --muted: #98A2B3;
    --line: rgba(255, 255, 255, 0.07);

    --working: #57B6A3;
    --waiting: #E8A13A;
    --waiting-soft: rgba(232, 161, 58, 0.16);
    --waiting-edge: rgba(232, 161, 58, 0.55);
    --limited: #9B8CC4;
    --danger: #C4735A;
    --nosignal: #7C8AA0;

    --radius: 13px;
    --gap: 14px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 18px 22px 14px;
    background: rgba(20, 24, 31, 0.72);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  @media (prefers-reduced-transparency: reduce) {
    header { background: var(--bg); backdrop-filter: none; }
  }

  .wordmark {
    font-weight: 620;
    letter-spacing: -0.015em;
    font-size: 1.05rem;
  }
  .waiting-count {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .waiting-count.active {
    color: var(--waiting);
    font-weight: 560;
  }
  header .spacer { flex: 1; }

  .mute {
    appearance: none;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 0.82rem;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .mute:hover { color: var(--text); border-color: rgba(255,255,255,0.16); }
  .mute:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }

  main {
    padding: 16px 22px 28px;
    display: grid;
    gap: var(--gap);
    grid-template-columns: 1fr;
    max-width: 1100px;
  }
  @media (min-width: 720px) {
    main { grid-template-columns: 1fr 1fr; }
  }
  /* An explicit display beats the [hidden] user-agent rule, so hide it explicitly
     when the channel view is active. */
  main[hidden] { display: none; }

  .card {
    position: relative;
    display: flex;
    gap: 14px;
    padding: 15px 17px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid transparent;
    border-radius: var(--radius);
    transition: transform 260ms var(--ease), box-shadow 260ms var(--ease),
                background 200ms var(--ease);
  }
  .card:hover { background: var(--surface-hover); }

  /* The rail dot: the state colour, quiet for ambient states. */
  .rail {
    flex: 0 0 auto;
    width: 9px;
    height: 9px;
    margin-top: 6px;
    border-radius: 50%;
    background: var(--muted);
  }
  .card.working .rail { background: var(--working); }
  .card.rate_limited .rail { background: var(--limited); }
  .card.crashed .rail { background: var(--danger); }

  .body { flex: 1 1 auto; min-width: 0; }

  .name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 600; letter-spacing: -0.01em; font-size: 1.06rem; }
  .role { color: var(--muted); font-size: 0.85rem; }

  .state-line {
    margin-top: 4px;
    font-size: 0.98rem;
    color: var(--muted);
  }
  .card.working .state-line { color: var(--working); }

  .task {
    margin-top: 3px;
    color: var(--text);
    opacity: 0.82;
    font-size: 0.92rem;
    overflow-wrap: anywhere;
  }

  .meta {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .chip {
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    white-space: nowrap;
  }

  /* The signature. The one warm card in a cool room. */
  .card.waiting_for_you {
    border-left-color: var(--waiting-edge);
    background: linear-gradient(90deg, var(--waiting-soft), var(--surface) 42%);
    box-shadow: 0 0 0 1px var(--waiting-soft), 0 8px 24px -12px rgba(232, 161, 58, 0.5);
    transform: translateY(-2px);
  }
  .card.waiting_for_you .rail { background: var(--waiting); }
  .card.waiting_for_you .state-line { color: var(--waiting); font-weight: 560; }

  /* The unseen badge: a small amber dot that clears when the person looks. */
  .badge {
    display: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--waiting);
    box-shadow: 0 0 0 0 var(--waiting-soft);
  }
  .card.badged .badge {
    display: inline-block;
    animation: pulse 2.4s var(--ease) infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232, 161, 58, 0.45); }
    50% { box-shadow: 0 0 0 5px rgba(232, 161, 58, 0); }
  }

  /* Cannot reach this one: spawned, alive, but silent. A dashed edge and a hollow
     ring read as a connection that did not complete, not as resting and not as a
     summons. Cool slate, deliberately not amber, which is reserved for the person
     being needed. Static, because a pulse would read as attention. */
  .card.not_reporting {
    border-left-style: dashed;
    border-left-color: var(--nosignal);
  }
  .card.not_reporting .rail {
    background: transparent;
    box-shadow: inset 0 0 0 1.5px var(--nosignal);
  }
  .card.not_reporting .state-line {
    color: var(--nosignal);
    font-style: italic;
  }

  /* A quiet informational note, for the context-lost line after a failed resume.
     Slate and small, deliberately not amber: it tells the person something, it
     does not summon them. */
  .note {
    margin-top: 4px;
    font-size: 0.85rem;
    color: var(--nosignal);
    overflow-wrap: anywhere;
  }

  .card[role="button"] { cursor: pointer; }
  .card[role="button"]:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }

  /* The left navigation rail: the first top-level navigation, Roster and Channel
     as siblings, the detail overlay sitting on top of whichever is active. Quiet
     and native, and the labels flex for longer translated words. */
  .app { display: flex; min-height: 100vh; }
  .rail {
    flex: 0 0 clamp(140px, 16%, 200px);
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 16px 12px;
    border-right: 1px solid var(--line);
    background: rgba(20, 24, 31, 0.4);
  }
  @media (prefers-reduced-transparency: reduce) { .rail { background: var(--bg); } }
  .rail-brand { font-weight: 620; letter-spacing: -0.015em; padding: 4px 10px 12px; }
  .rail-item {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--muted);
    font: inherit;
    text-align: left;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .rail-item:hover { color: var(--text); background: var(--surface); }
  .rail-item.active { color: var(--text); background: var(--surface); font-weight: 560; }
  .rail-item:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

  .channel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .channel[hidden] { display: none; }
  .timeline {
    flex: 1;
    overflow-y: auto;
    padding: 16px 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row { max-width: 760px; overflow-wrap: anywhere; }
  .row.message {
    padding: 9px 13px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 11px;
  }
  .row.message .who { font-weight: 600; margin-right: 8px; }
  .row.message .body { color: var(--text); opacity: 0.9; }
  .row.event { color: var(--muted); font-size: 0.95rem; padding: 4px 6px; }
  /* The one about the person, given the roster's amber weight so a question does
     not read like an ambient notice. */
  .row.event.waiting {
    color: var(--waiting);
    font-weight: 560;
    padding: 8px 13px;
    border-left: 3px solid var(--waiting-edge);
    border-radius: 4px;
    background: linear-gradient(90deg, var(--waiting-soft), transparent 45%);
  }
  .ref {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 6px;
  }

  .row-reply { margin-top: 6px; }
  .row-reply-toggle {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.82rem;
    padding: 2px 0;
    cursor: pointer;
  }
  .row-reply-toggle:hover { color: var(--text); }
  .row-reply-toggle:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .row-reply-input {
    display: block;
    width: 100%;
    max-width: 560px;
    margin-top: 6px;
    resize: vertical;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 11px;
    font: inherit;
    line-height: 1.5;
  }
  .row-reply-input:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .row-reply-input::placeholder { color: var(--muted); }
  /* An explicit display beats the [hidden] default, so hide the collapsed input
     explicitly until its Reply toggle opens it. */
  .row-reply-input[hidden] { display: none; }

  /* The detail view, same window, two panes: the colleague's terminal and, later,
     the input box the write half adds. It fills the window over the roster and
     hands back with a clear control. */
  .detail {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .detail[hidden] { display: none; }
  .detail-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(20, 24, 31, 0.72);
    backdrop-filter: blur(18px) saturate(160%);
  }
  @media (prefers-reduced-transparency: reduce) {
    .detail-head { background: var(--bg); backdrop-filter: none; }
  }
  .back {
    appearance: none;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .back:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.16); }
  .detail-name { font-weight: 600; letter-spacing: -0.01em; }
  .detail-role { color: var(--muted); font-size: 0.85rem; }
  .detail-body { flex: 1; display: flex; min-height: 0; }
  .term { flex: 1 1 auto; min-width: 0; padding: 8px 10px; background: #0F1319; overflow: hidden; }
  .detail-side {
    flex: 0 0 clamp(220px, 28%, 360px);
    border-left: 1px solid var(--line);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .reply-label { color: var(--muted); font-size: 0.85rem; }
  .reply {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    line-height: 1.5;
  }
  .reply:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .reply::placeholder { color: var(--muted); }
  .reply-hint { color: var(--muted); font-size: 0.8rem; margin: 0; }

  .empty {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    color: var(--muted);
    padding: 72px 20px;
  }
  .empty strong { color: var(--text); font-weight: 560; font-size: 1.15rem; display: block; margin-bottom: 8px; }
  .empty p { margin: 0 0 22px; max-width: 30rem; line-height: 1.55; }

  /* Header and empty-state actions, in the roster's quiet register. The primary
     one carries the working accent; the secondary is a quiet outline. Labels flex
     for longer translated text. */
  .header-btn {
    appearance: none;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 0.82rem;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .header-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.16); }
  .header-btn:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }

  .btn {
    appearance: none;
    font: inherit;
    font-size: 0.92rem;
    padding: 9px 16px;
    border-radius: 9px;
    cursor: pointer;
    border: 1px solid var(--line);
  }
  .btn:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .btn-primary {
    background: var(--working);
    border-color: transparent;
    color: #0F1319;
    font-weight: 560;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
  }
  .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.16); }

  /* The create sheets: a centred card over a dimmed room, same window. In the
     roster's palette so they read as part of the app, not bolted on. */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(12, 15, 20, 0.6);
    backdrop-filter: blur(3px);
  }
  @media (prefers-reduced-transparency: reduce) {
    .sheet-backdrop { background: rgba(12, 15, 20, 0.92); backdrop-filter: none; }
  }
  .sheet-backdrop[hidden] { display: none; }
  .sheet {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: 0 24px 64px -24px rgba(0, 0, 0, 0.7);
  }
  .sheet-title { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { color: var(--muted); font-size: 0.85rem; }
  .field input, .field select {
    appearance: none;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 11px;
    font: inherit;
  }
  .field select { cursor: pointer; }
  .field input:focus-visible, .field select:focus-visible {
    outline: 2px solid var(--working);
    outline-offset: 2px;
  }
  .field input::placeholder { color: var(--muted); }
  .form-hint { margin: 0; color: var(--muted); font-size: 0.8rem; line-height: 1.45; }
  .form-error {
    margin: 0;
    color: var(--waiting);
    font-size: 0.85rem;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .form-error[hidden] { display: none; }
  .sheet-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: background 160ms ease; transform: none !important; }
    .card.badged .badge { animation: none; }
  }

  :focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
</style>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <span class="rail-brand">Stafford</span>
    <button class="rail-item active" type="button" data-view="roster">Roster</button>
    <button class="rail-item" type="button" data-view="channel">Channel</button>
  </nav>
  <div class="content">
    <header>
      <span id="waiting-count" class="waiting-count"></span>
      <span class="spacer"></span>
      <button id="add-project-header" class="header-btn" type="button">Add project</button>
      <button id="hire-header" class="header-btn" type="button">Hire</button>
      <button id="mute" class="mute" type="button" aria-pressed="false">Mute</button>
    </header>
    <main id="roster" aria-live="polite"></main>
    <section id="channel" class="channel" hidden aria-label="Channel timeline">
      <div id="timeline" class="timeline" aria-live="polite"></div>
    </section>
  </div>
</div>

<section id="project-sheet" class="sheet-backdrop" hidden aria-label="Add a project">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="project-sheet-title">
    <h2 id="project-sheet-title" class="sheet-title">Add a project</h2>
    <div class="field">
      <label id="project-name-label" for="project-name">Name</label>
      <input id="project-name" type="text" autocomplete="off" />
    </div>
    <div class="field">
      <label id="project-repo-label" for="project-repo">Repository folder</label>
      <input id="project-repo" type="text" autocomplete="off" spellcheck="false" />
      <p id="project-hint" class="form-hint"></p>
    </div>
    <p id="project-error" class="form-error" role="alert" hidden></p>
    <div class="sheet-actions">
      <button id="project-cancel" class="btn btn-secondary" type="button">Cancel</button>
      <button id="project-create" class="btn btn-primary" type="button">Add project</button>
    </div>
  </div>
</section>

<section id="hire-sheet" class="sheet-backdrop" hidden aria-label="Hire a colleague">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="hire-sheet-title">
    <h2 id="hire-sheet-title" class="sheet-title">Hire a colleague</h2>
    <div class="field">
      <label id="hire-name-label" for="hire-name">Name</label>
      <input id="hire-name" type="text" autocomplete="off" />
    </div>
    <div class="field">
      <label id="hire-role-label" for="hire-role">Role</label>
      <select id="hire-role"></select>
    </div>
    <div class="field">
      <label id="hire-project-label" for="hire-project">Project</label>
      <select id="hire-project"></select>
    </div>
    <p id="hire-error" class="form-error" role="alert" hidden></p>
    <div class="sheet-actions">
      <button id="hire-cancel" class="btn btn-secondary" type="button">Cancel</button>
      <button id="hire-submit" class="btn btn-primary" type="button">Hire</button>
    </div>
  </div>
</section>

<section id="detail" class="detail" hidden aria-hidden="true" aria-label="Colleague detail">
  <div class="detail-head">
    <button id="detail-back" class="back" type="button">Back to roster</button>
    <span id="detail-name" class="detail-name"></span>
    <span id="detail-role" class="detail-role"></span>
  </div>
  <div class="detail-body">
    <div id="term" class="term"></div>
    <div class="detail-side">
      <label class="reply-label" for="reply">Your message</label>
      <textarea id="reply" class="reply" rows="4"
        placeholder="Type a message. Enter sends, Shift-Enter adds a line."></textarea>
      <p class="reply-hint">Enter sends. Shift-Enter adds a line.</p>
    </div>
  </div>
</section>

<script type="module" src="./roster.ts"></script>
