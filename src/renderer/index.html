<!doctype html>
<meta charset="utf-8" />
<title>Stafford</title>
<!--
  The roster. A calm, mostly-quiet room of colleagues, with one warm signal when
  one of them needs you. Dark by default, because this sits ambient in a tray. The
  one place boldness is spent is the waiting card: a warm amber edge and a soft
  lift among cool, recessed idle and working cards.

  No fixed widths sized to English. State and task lines vary by language, so
  cards flex and text wraps. Reduced motion and reduced transparency are honoured.
  The platform system font, because no external face can load under the CSP and
  the personality lives in the treatment and the amber signature, not a novelty
  face.
-->
<style>
  :root {
    /* Geist register: near-black neutral base, high-contrast text, hairline lines.
       One accent, amber, spent only on waiting. Everything else grayscale-quiet. */
    --bg: #0A0A0A;
    --surface: #141414;
    --surface-hover: #1C1C1C;
    --text: #EDEDED;
    --muted: #8F8F8F;
    --line: rgba(255, 255, 255, 0.09);
    --focus: rgba(255, 255, 255, 0.55);

    /* The non-waiting states are grayscale-quiet, not coloured. */
    --working: #C9C9C9;
    --waiting: #E8A13A;
    --waiting-soft: rgba(232, 161, 58, 0.14);
    --waiting-edge: rgba(232, 161, 58, 0.55);
    --limited: #9A9A9A;
    --danger: #B5B5B5;
    --nosignal: #6E6E6E;

    --radius: 10px;
    --gap: 12px;
    /* Critically damped, no overshoot: an ease-out settle, ~0.32s. */
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --settle: 320ms;

    font: 14px/1.5 "Geist", "Geist Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: -0.006em;
    --mono: "Geist Mono", ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 18px 22px 14px;
    background: rgba(20, 24, 31, 0.72);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  @media (prefers-reduced-transparency: reduce) {
    header { background: var(--bg); backdrop-filter: none; }
  }

  .wordmark {
    font-weight: 620;
    letter-spacing: -0.015em;
    font-size: 1.05rem;
  }
  .waiting-count {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .waiting-count.active {
    color: var(--waiting);
    font-weight: 560;
  }
  header .spacer { flex: 1; }

  .mute {
    appearance: none;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 0.82rem;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .mute:hover { color: var(--text); border-color: rgba(255,255,255,0.16); }
  .mute:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }

  /* The three-pane workspace: the roster in the centre, the detail pane on the
     right, a hairline between. The nav rail is the third pane, to the left. */
  .workspace { flex: 1 1 auto; min-height: 0; display: flex; }
  .workspace[hidden] { display: none; }

  /* The three-pane workspace never scrolls sideways: each pane scrolls its own. */
  .workspace { overflow: hidden; }

  /* The roster, centre pane: a single column of cards, its own scroll. It may
     shrink so the detail pane always has room. */
  .roster {
    flex: 1 1 clamp(300px, 38%, 440px);
    min-width: 0;
    overflow-y: auto;
    padding: 16px 18px 28px;
    display: grid;
    gap: var(--gap);
    grid-template-columns: 1fr;
    align-content: start;
    border-right: 1px solid var(--line);
  }
  .roster[hidden] { display: none; }

  /* Group headers: a quiet state name and a count, grayscale. Only the waiting
     cards carry the amber accent, never the header. */
  .group-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 4px 6px 2px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.01em;
  }
  .group-header:first-child { margin-top: 0; }
  .group-label { font-weight: 560; overflow-wrap: anywhere; }
  .group-count { flex: 0 0 auto; font-variant-numeric: tabular-nums; opacity: 0.75; }

  /* The detail pane, right: fills the rest, shows the empty state or a colleague. */
  .detail-pane { flex: 1 1 auto; min-width: 0; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

  .card {
    position: relative;
    display: flex;
    gap: 14px;
    padding: 15px 17px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid transparent;
    border-radius: var(--radius);
    transition: transform 260ms var(--ease), box-shadow 260ms var(--ease),
                background 200ms var(--ease);
  }
  .card:hover { background: var(--surface-hover); }
  /* The card whose detail fills the right pane reads selected, quietly. */
  .card.selected { background: var(--surface-hover); border-color: rgba(255, 255, 255, 0.18); }

  /* The card's state dot: the state colour, quiet for ambient states. Named
     card-rail so it does not collide with the nav rail's own .rail rules. */
  .card-rail {
    flex: 0 0 auto;
    width: 9px;
    height: 9px;
    margin-top: 6px;
    border-radius: 50%;
    background: var(--muted);
  }
  .card.working .card-rail { background: var(--working); }
  .card.rate_limited .card-rail { background: var(--limited); }
  .card.crashed .card-rail { background: var(--danger); }

  .body { flex: 1 1 auto; min-width: 0; }

  .name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 600; letter-spacing: -0.01em; font-size: 1.06rem; }
  .role { color: var(--muted); font-size: 0.85rem; }

  .state-line {
    margin-top: 4px;
    font-size: 0.98rem;
    color: var(--muted);
  }
  .card.working .state-line { color: var(--working); }

  .task {
    margin-top: 3px;
    color: var(--text);
    opacity: 0.82;
    font-size: 0.92rem;
    overflow-wrap: anywhere;
  }

  .meta {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .chip {
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    white-space: nowrap;
  }

  /* The signature. The one warm card in a cool room. */
  .card.waiting_for_you {
    border-left-color: var(--waiting-edge);
    background: linear-gradient(90deg, var(--waiting-soft), var(--surface) 42%);
    box-shadow: 0 0 0 1px var(--waiting-soft), 0 8px 24px -12px rgba(232, 161, 58, 0.5);
    transform: translateY(-2px);
  }
  .card.waiting_for_you .card-rail { background: var(--waiting); }
  .card.waiting_for_you .state-line { color: var(--waiting); font-weight: 560; }

  /* The unseen badge: a small amber dot that clears when the person looks. */
  .badge {
    display: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--waiting);
    box-shadow: 0 0 0 0 var(--waiting-soft);
  }
  .card.badged .badge {
    display: inline-block;
    animation: pulse 2.4s var(--ease) infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232, 161, 58, 0.45); }
    50% { box-shadow: 0 0 0 5px rgba(232, 161, 58, 0); }
  }

  /* Cannot reach this one: spawned, alive, but silent. A dashed edge and a hollow
     ring read as a connection that did not complete, not as resting and not as a
     summons. Cool slate, deliberately not amber, which is reserved for the person
     being needed. Static, because a pulse would read as attention. */
  .card.not_reporting {
    border-left-style: dashed;
    border-left-color: var(--nosignal);
  }
  .card.not_reporting .card-rail {
    background: transparent;
    box-shadow: inset 0 0 0 1.5px var(--nosignal);
  }
  .card.not_reporting .state-line {
    color: var(--nosignal);
    font-style: italic;
  }

  /* A quiet informational note, for the context-lost line after a failed resume.
     Slate and small, deliberately not amber: it tells the person something, it
     does not summon them. */
  .note {
    margin-top: 4px;
    font-size: 0.85rem;
    color: var(--nosignal);
    overflow-wrap: anywhere;
  }

  .card[role="button"] { cursor: pointer; }
  .card[role="button"]:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }

  /* The left navigation rail: the first top-level navigation, Roster and Channel
     as siblings, the detail overlay sitting on top of whichever is active. Quiet
     and native, and the labels flex for longer translated words. */
  .app { display: flex; min-height: 100vh; }
  .rail {
    flex: 0 0 clamp(140px, 16%, 200px);
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 16px 12px;
    border-right: 1px solid var(--line);
    background: rgba(20, 24, 31, 0.4);
  }
  @media (prefers-reduced-transparency: reduce) { .rail { background: var(--bg); } }
  .rail-brand { font-weight: 620; letter-spacing: -0.015em; padding: 4px 10px 12px; }
  .rail-item {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--muted);
    font: inherit;
    text-align: left;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .rail-item:hover { color: var(--text); background: var(--surface); }
  .rail-item.active { color: var(--text); background: var(--surface); font-weight: 560; }
  .rail-item:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

  .channel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .channel[hidden] { display: none; }
  .timeline {
    flex: 1;
    overflow-y: auto;
    padding: 16px 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row { max-width: 760px; overflow-wrap: anywhere; }
  .row.message {
    padding: 9px 13px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 11px;
  }
  .row.message .who { font-weight: 600; margin-right: 8px; }
  .row.message .body { color: var(--text); opacity: 0.9; }
  .row.event { color: var(--muted); font-size: 0.95rem; padding: 4px 6px; }
  /* The one about the person, given the roster's amber weight so a question does
     not read like an ambient notice. */
  .row.event.waiting {
    color: var(--waiting);
    font-weight: 560;
    padding: 8px 13px;
    border-left: 3px solid var(--waiting-edge);
    border-radius: 4px;
    background: linear-gradient(90deg, var(--waiting-soft), transparent 45%);
  }
  .ref {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 6px;
  }

  .row-reply { margin-top: 6px; }
  .row-reply-toggle {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.82rem;
    padding: 2px 0;
    cursor: pointer;
  }
  .row-reply-toggle:hover { color: var(--text); }
  .row-reply-toggle:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .row-reply-input {
    display: block;
    width: 100%;
    max-width: 560px;
    margin-top: 6px;
    resize: vertical;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 11px;
    font: inherit;
    line-height: 1.5;
  }
  .row-reply-input:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .row-reply-input::placeholder { color: var(--muted); }
  /* An explicit display beats the [hidden] default, so hide the collapsed input
     explicitly until its Reply toggle opens it. */
  .row-reply-input[hidden] { display: none; }

  /* The detail pane's empty state: calm, one line, when no colleague is selected. */
  .detail-empty {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
    padding: 40px;
    color: var(--muted);
  }
  .detail-empty[hidden] { display: none; }
  .detail-empty strong { color: var(--text); font-weight: 560; font-size: 1.05rem; letter-spacing: -0.01em; }
  .detail-empty p { margin: 0; max-width: 26rem; line-height: 1.55; }

  /* The selected colleague's detail, filling the right pane: a head, the tab bar,
     and the panels. A settle-in cross-fade when a colleague is picked. */
  .detail { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .detail[hidden] { display: none; }
  .detail:not([hidden]) { animation: settle-in var(--settle) var(--ease); }
  @keyframes settle-in { from { opacity: 0; } to { opacity: 1; } }
  .detail-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 20px 10px;
  }
  .detail-name { font-weight: 600; letter-spacing: -0.012em; font-size: 1.02rem; }
  .detail-role { color: var(--muted); font-size: 0.85rem; }

  /* The tab bar: Conversation, Activity, Terminal. A quiet underline marks the
     active tab, no pill, no colour. Instant feedback on pointer-down. */
  .tabbar {
    display: flex;
    gap: 2px;
    padding: 0 12px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; }
  .tab {
    appearance: none;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.9rem;
    padding: 8px 12px;
    margin-bottom: -1px;
    cursor: pointer;
    transition: color var(--settle) var(--ease);
  }
  .tab:hover { color: var(--text); }
  .tab:active { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }
  .tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 4px; }

  .panels { flex: 1 1 auto; min-height: 0; display: flex; }
  .panel { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .panel[hidden] { display: none; }
  .panel:not([hidden]) { animation: settle-in var(--settle) var(--ease); }

  /* Conversation: the transcript scrolls, the composer sits at the bottom. */
  .conversation {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .conversation .row { max-width: 680px; overflow-wrap: anywhere; }
  .composer { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; flex-direction: column; gap: 6px; }
  .reply {
    width: 100%;
    resize: vertical;
    min-height: 44px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 12px;
    font: inherit;
    line-height: 1.5;
  }
  .reply:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .reply::placeholder { color: var(--muted); }
  .reply-hint { color: var(--muted); font-size: 0.78rem; margin: 0; }

  /* The Terminal tab: the existing xterm, unchanged, filling its panel. */
  .panel-terminal { padding: 6px 8px; }
  .term { flex: 1 1 auto; min-width: 0; background: #0A0A0A; overflow: hidden; }

  /* The Activity tab: a colleague's stored events as a quiet feed. Hairline row
     separation, a small line icon per type, timestamps de-emphasized, one amber
     row for a waiting event and grayscale for the rest. */
  .panel-activity { padding: 4px 2px; overflow: hidden; }
  .activity-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 10px; }
  .act-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font-size: 0.92rem;
  }
  .act-row:last-child { border-bottom: 0; }
  .act-icon { align-self: center; display: inline-flex; flex: 0 0 auto; color: var(--muted); }
  .act-line { flex: 1 1 auto; min-width: 0; line-height: 1.45; overflow-wrap: anywhere; }
  .act-time {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 0.76rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* A quiet status tag on a tool row, grayscale so it never takes the amber accent.
     Only a failure or an interruption shows one; an ok action stays untagged. */
  .act-status {
    flex: 0 0 auto;
    font-size: 0.72rem;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 6px;
    white-space: nowrap;
  }
  .act-row.act-error .act-status { color: var(--danger); border-color: rgba(255, 255, 255, 0.16); }
  .act-row.act-incomplete .act-line { color: var(--muted); }
  /* The one accent: a waiting event, the row the person acts on. */
  .act-row.waiting { box-shadow: inset 2px 0 0 var(--waiting-edge); }
  .act-row.waiting .act-icon { color: var(--waiting); }
  .activity-empty {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    max-width: 30rem;
    margin: 0 auto;
    color: var(--muted);
    line-height: 1.55;
  }
  /* An explicit display beats the UA [hidden] default, so hide these by hand. */
  .activity-list[hidden], .activity-empty[hidden] { display: none; }

  /* A new row settles in, unless the person asked for less motion, then it just
     appears. */
  @media (prefers-reduced-motion: no-preference) {
    .act-row.enter { animation: act-in 220ms cubic-bezier(0.2, 0.7, 0.2, 1); }
    @keyframes act-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }

  @media (prefers-reduced-motion: reduce) {
    .detail:not([hidden]), .panel:not([hidden]) { animation: none; }
    .tab { transition: none; }
  }

  .empty {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    color: var(--muted);
    padding: 72px 20px;
  }
  .empty strong { color: var(--text); font-weight: 560; font-size: 1.15rem; display: block; margin-bottom: 8px; }
  .empty p { margin: 0 0 22px; max-width: 30rem; line-height: 1.55; }

  /* Header and empty-state actions, in the roster's quiet register. The primary
     one carries the working accent; the secondary is a quiet outline. Labels flex
     for longer translated text. */
  .header-btn {
    appearance: none;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 0.82rem;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .header-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.16); }
  .header-btn:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }

  .btn {
    appearance: none;
    font: inherit;
    font-size: 0.92rem;
    padding: 9px 16px;
    border-radius: 9px;
    cursor: pointer;
    border: 1px solid var(--line);
  }
  .btn:focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  .btn-primary {
    background: var(--working);
    border-color: transparent;
    color: #0F1319;
    font-weight: 560;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
  }
  .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.16); }

  /* The create sheets: a centred card over a dimmed room, same window. In the
     roster's palette so they read as part of the app, not bolted on. */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(12, 15, 20, 0.6);
    backdrop-filter: blur(3px);
  }
  @media (prefers-reduced-transparency: reduce) {
    .sheet-backdrop { background: rgba(12, 15, 20, 0.92); backdrop-filter: none; }
  }
  .sheet-backdrop[hidden] { display: none; }
  .sheet {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: 0 24px 64px -24px rgba(0, 0, 0, 0.7);
  }
  .sheet-title { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { color: var(--muted); font-size: 0.85rem; }
  .field input, .field select {
    appearance: none;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 11px;
    font: inherit;
  }
  .field select { cursor: pointer; }
  .field input:focus-visible, .field select:focus-visible {
    outline: 2px solid var(--working);
    outline-offset: 2px;
  }
  .field input::placeholder { color: var(--muted); }
  .form-hint { margin: 0; color: var(--muted); font-size: 0.8rem; line-height: 1.45; }
  .form-error {
    margin: 0;
    color: var(--waiting);
    font-size: 0.85rem;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .form-error[hidden] { display: none; }
